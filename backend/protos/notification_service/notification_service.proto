syntax = "proto3";

package notification;

service NotificationService {
    // Send email with verification code to login
    rpc SendVerificationCode (VerificationCodeRequest) returns (NotificationResponse);
    // Send notification that reservation was made / moved / cancelled via email
    rpc SendReservationNotification (ReservationNotificationRequest) returns (NotificationResponse);
    // Send notification that item was added to schedule for specific group or education programme
    rpc SendScheduleAddedItem (ScheduleAddedItemRequest) returns (NotificationResponse);
    // Send notification that item was deleted from schedule for specific group or education programme
    rpc SendScheduleDeletedItem () returns (NotificationResponse);
    // Send notification that item was edited in schedule for specific group or education programme
    rpc SendScheduleEditedItem () returns (NotificationResponse);
}

// Send verification code request structure
message VerificationCodeRequest {
    // email address of recipient
    string email = 1;
    // verification code
    string code = 2;
    // verification url for faster input
    string verification_url = 3;
    // validity of the code
    string code_valid_till = 4;
}

message ClassroomAddress {
    string building_name = 1;
    string building_address = 2;
    string classroom_number = 3;
}

message ReservationNotificationRequest {
    int64 id = 1;
    string status = 2;
    string owner_email = 3;
    ClassroomAddress class_address = 4;
    string date = 5;
    repeated string time_slots = 6; 
}

// Study groups of a specific education programme
message StudyGroup {
    // education programme name that contains the group
    string programme_name = 1;
    // code name of the group. Ex: 22SE-3
    string group_name = 2;
    // email address of a group
    string group_email = 3;
}

// Item of room in ScheduleBuildingItem
message ScheduleRoomItem {
    // date when room is occupied
    string date = 1;
    // list of timeslots when room is occupied
    repeated string timeslots = 2;
    // occupied room number
    string room_number = 3;
}

// Item of building in ScheduleItem
message ScheduleBuildingItem {
    // building name that contains occupied room
    string building_name = 1;
    // building address that contains occupied room
    string building_address = 2;
    // list of room items that are occupied in the building
    repeated ScheduleRoomItem room_items = 3;
}

// Schedule item 
message ScheduleItem {
    // name of the course in the schedule item
    string course_name = 1;
    // type of the course (lection | seminar | exam)
    string course_type = 2;
    // Name of the tutor
    string tutor_name = 3;
    // list of groups that enrolled the course
    repeated StudyGroup groups = 4;
}


message ScheduleAddedItemRequest {
    string group_email = 1;
    string tutor_email = 2;
    string manager_email = 3;
    string group_name = 4;
    string tutor_name = 5;
    string course_name = 6;
    repeated ScheduleItem items = 7;

}

message NotificationResponse {
    int32 status_code = 1;
    string status = 2;
    string details = 3;
}
