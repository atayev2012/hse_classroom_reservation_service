<!doctype html>
<html lang="ru">
<body style="margin:0;background:#d7ecf6;font-family:Arial,Helvetica,sans-serif;color:#0f4f7d;">
  <div style="max-width:680px;margin:0 auto;padding:32px 18px;">
    <div style="padding:0 0 18px 0;font-size:14px;color:#6c8797;">НИУ ВШЭ Нижний Новгород</div>
    <div style="background:#ffffff;border-radius:18px;padding:28px;box-shadow:0 10px 30px rgba(15,79,125,0.08);">
      <h1 style="margin:0 0 12px;font-size:24px;line-height:1.25;color:#0f4f7d;">Код подтверждения</h1>
      <p style="margin:0 0 22px;color:#4c6d80;font-size:15px;line-height:1.6;">Используйте этот код для входа в систему расписаний и бронирования.</p>
      <div style="background:#cfe5f1;border-radius:10px;padding:22px;text-align:center;font-size:34px;letter-spacing:6px;font-weight:700;color:#0f4f7d;">{{ code }}</div>
      <p style="margin:22px 0 0;color:#4c6d80;font-size:14px;line-height:1.6;">Почта: <strong>{{ email }}</strong><br>Код действует до: <strong>{{ code_valid_till }}</strong></p>
      <a href="{{ verification_url }}" style="display:inline-block;margin-top:22px;background:#2f8bc1;color:#ffffff;text-decoration:none;border-radius:8px;padding:12px 18px;font-weight:700;">Подтвердить вход</a>
    </div>
    <div style="margin-top:18px;color:#6c8797;font-size:12px;">IP: {{ ip_address }} · Устройство: {{ device_info }}</div>
  </div>
</body>
</html>
