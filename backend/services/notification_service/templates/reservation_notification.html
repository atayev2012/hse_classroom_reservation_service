<!doctype html>
<html lang="ru">
<body style="margin:0;background:#d7ecf6;font-family:Arial,Helvetica,sans-serif;color:#0f4f7d;">
  <div style="max-width:720px;margin:0 auto;padding:32px 18px;">
    <div style="padding:0 0 18px 0;font-size:14px;color:#6c8797;">НИУ ВШЭ Нижний Новгород</div>
    <div style="background:#ffffff;border-radius:18px;padding:28px;box-shadow:0 10px 30px rgba(15,79,125,0.08);">
      <h1 style="margin:0 0 12px;font-size:24px;color:#0f4f7d;">Бронирование аудитории</h1>
      <p style="margin:0 0 22px;color:#4c6d80;font-size:15px;line-height:1.6;">Статус бронирования: <strong>{{ status }}</strong></p>
      <table role="presentation" style="width:100%;border-spacing:8px;border-collapse:separate;">
        <tr>
          <td style="background:#cfe5f1;border-radius:8px;padding:14px;color:#0f4f7d;font-weight:700;">{{ event_date }}</td>
          <td style="background:#e6eaec;border-radius:8px;padding:14px;color:#0f4f7d;">{{ time_slot }}</td>
        </tr>
        <tr>
          <td style="background:#edf5f9;border-radius:8px;padding:14px;color:#4c6d80;">{{ building_name }}</td>
          <td style="background:#edf5f9;border-radius:8px;padding:14px;color:#4c6d80;">Аудитория {{ room_number }}</td>
        </tr>
      </table>
    </div>
  </div>
</body>
</html>
