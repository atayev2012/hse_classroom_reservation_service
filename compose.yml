services:
  gateway:
    build:
      context: ./backend/gateway
    container_name: HSE_gateway
    ports:
      - "8000:8000"
    volumes:
      - ./backend/gateway:/app
    depends_on:
      pg:
        condition: service_healthy
  
  pg:
    image: postgres:16.4
    env_file: ".env"
    environment:
      - POSTGRES_DB:${POSTGRES_DB}
      - POSTGRES_USER:${POSTGRES_USER}
      - POSTGRES_PW:${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT_HOST}:${POSTGRES_PORT_CONTAINER}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 3
    
volumes:
  pgdata:
